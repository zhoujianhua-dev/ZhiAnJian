{% extends "base.html" %}
{% block title %}单位标签{% endblock %}
{% block page_title %}单位标签{% endblock %}
{% block page_crumb %}单位管理 / 标签{% endblock %}

{% block content %}
<div class="card">
  <div class="toolbar">
    <input class="input" id="kw" placeholder="按标签名搜索..." style="width:200px" onkeydown="if(event.key==='Enter')loadTags(1)">
    <button class="btn btn-primary" onclick="loadTags(1)">搜索</button>
    <span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" onclick="openAssign()">关联单位到标签</button>
    <button class="btn btn-primary btn-sm" onclick="openAdd()">+ 新建标签</button>
  </div>
  <div class="table-wrap" id="tagTable"><div class="loading-mask"><div class="spinner"></div>加载中...</div></div>
  <div class="pagination" id="tagPager"></div>
</div>
{% endblock %}

{% block js %}
<script>
let curPage = 1, curLimit = 10, totalCount = 0;

async function loadTags(page) {
  curPage = page;
  const kw = document.getElementById("kw").value.trim();
  const el = document.getElementById("tagTable");
  ZhiShield.showLoading(el);
  const r = await ZhiShield.api(`/api/tags?page=${page}&limit=${curLimit}&keyword=${encodeURIComponent(kw)}`);
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  totalCount = r.count;
  if (!r.data.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-title">暂无标签</div><div class="empty-desc">新建标签并关联单位，便于批量管理资产</div></div>`;
  } else {
    let html = `<table class="data-table"><thead><tr><th>ID</th><th>标签名称</th><th>描述</th><th>关联单位</th><th>单位数</th><th>创建时间</th><th>操作</th></tr></thead><tbody>`;
    r.data.forEach(t => {
      const units = t.unit ? t.unit.split("\n").map(u => `<span class="chip">${ZhiShield.esc(u)}</span>`).join("") : "-";
      html += `<tr>
        <td>${t.id}</td>
        <td style="font-weight:700;color:var(--primary)">${ZhiShield.esc(t.name)}</td>
        <td style="max-width:200px">${ZhiShield.esc(t.description || "-")}</td>
        <td style="max-width:260px">${units}</td>
        <td><span class="badge badge-blue">${t.unit_count}</span></td>
        <td style="color:#94a3b8;font-size:12px">${ZhiShield.fmtTime(t.created_at)}</td>
        <td style="white-space:nowrap">
          <a class="link-btn" onclick="editTag(${t.id})">编辑</a>
          <a class="link-btn danger" onclick="delTag(${t.id},'${ZhiShield.esc(t.name).replace(/'/g,"\\'")}')">删除</a>
        </td></tr>`;
    });
    el.innerHTML = html + "</tbody></table>";
  }
  ZhiShield.renderPagination(document.getElementById("tagPager"), curPage, totalCount, curLimit, loadTags);
}

async function openAssign() {
  const r = await ZhiShield.api("/api/tags/options");
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  if (!r.data.length) { ZhiShield.error("请先新建至少一个标签"); return; }
  const opts = r.data.map(t => `<option value="${t.id}">${ZhiShield.esc(t.name)}</option>`).join("");
  ZhiShield.openModal({
    title: "关联单位到标签",
    size: "",
    body: `<div class="form-grid">
      <div class="form-item full"><label>选择标签 <span class="req">*</span></label><select class="select" id="aTag">${opts}</select></div>
      <div class="form-item full"><label>要关联的单位（每行一个；不存在的单位会自动新建，已有关联不会被清除）</label>
        <textarea class="textarea" id="aUnit" rows="8" placeholder="每行一个单位名称"></textarea></div>
    </div>`,
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="doAssign()">关联</button>`
  });
}
async function doAssign() {
  const tag_id = document.getElementById("aTag").value;
  const unit = document.getElementById("aUnit").value.trim();
  if (!unit) { ZhiShield.error("请输入至少一个单位名称"); return; }
  const r = await ZhiShield.api("/api/tags/assign", { json: { tag_id, unit } });
  if (r.code === 0) {
    ZhiShield.success(`关联成功：新建单位 ${r.success_count} 个，已存在 ${r.existing_count} 个`);
    ZhiShield.closeModal(); loadTags(curPage);
  } else ZhiShield.error(r.msg);
}

function openAdd() {
  ZhiShield.openModal({
    title: "新建标签",
    size: "",
    body: `<div class="form-grid">
      <div class="form-item full"><label>标签名称 <span class="req">*</span></label><input class="input" id="tName" placeholder="如：重点监管单位"></div>
      <div class="form-item full"><label>描述</label><textarea class="textarea" id="tDesc" rows="2"></textarea></div>
      <div class="form-item full"><label>关联单位（每行一个单位名称）</label><textarea class="textarea" id="tUnit" rows="6" placeholder="每行一个单位名称"></textarea></div>
    </div>`,
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="doAdd()">创建</button>`
  });
}
async function doAdd() {
  const name = document.getElementById("tName").value.trim();
  if (!name) { ZhiShield.error("请输入标签名称"); return; }
  const r = await ZhiShield.api("/api/tags/add", { json: {
    name, description: document.getElementById("tDesc").value,
    unit: document.getElementById("tUnit").value } });
  if (r.code === 0) { ZhiShield.success(r.msg); ZhiShield.closeModal(); loadTags(1); }
  else ZhiShield.error(r.msg);
}

async function editTag(id) {
  const r = await ZhiShield.api("/api/tags/detail?id=" + id);
  if (r.code !== 0) return;
  const t = r.data;
  ZhiShield.openModal({
    title: "编辑标签",
    size: "",
    body: `<div class="form-grid">
      <div class="form-item full"><label>标签名称 <span class="req">*</span></label><input class="input" id="tName" value="${ZhiShield.esc(t.name)}"></div>
      <div class="form-item full"><label>描述</label><textarea class="textarea" id="tDesc" rows="2">${ZhiShield.esc(t.description)}</textarea></div>
      <div class="form-item full"><label>关联单位（每行一个）</label><textarea class="textarea" id="tUnit" rows="8">${ZhiShield.esc(t.unit)}</textarea></div>
    </div>`,
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="doEdit(${id})">保存</button>`
  });
}
async function doEdit(id) {
  const r = await ZhiShield.api("/api/tags/update", { json: {
    id, name: document.getElementById("tName").value.trim(),
    description: document.getElementById("tDesc").value,
    unit: document.getElementById("tUnit").value } });
  if (r.code === 0) { ZhiShield.success(r.msg); ZhiShield.closeModal(); loadTags(curPage); }
  else ZhiShield.error(r.msg);
}

function delTag(id, name) {
  ZhiShield.confirmDialog(`确定删除标签「${name}」？关联关系将一并解除。`, async () => {
    const r = await ZhiShield.api("/api/tags/delete", { json: { id } });
    if (r.code === 0) { ZhiShield.success("已删除"); loadTags(curPage); } else ZhiShield.error(r.msg);
  }, "删除");
}

loadTags(1);
</script>
{% endblock %}
