{% extends "base.html" %}
{% block title %}报告管理{% endblock %}
{% block page_title %}报告管理{% endblock %}
{% block page_crumb %}报告 / 漏洞报告列表与导出{% endblock %}

{% block content %}
<div class="card">
  <div class="toolbar">
    <input class="input" id="kwUnit" placeholder="按单位搜索..." style="width:180px">
    <input class="input" id="kwVul" placeholder="按漏洞搜索..." style="width:180px" onkeydown="if(event.key==='Enter')loadReports(1)">
    <select class="select" id="sevFilter" style="width:120px" onchange="loadReports(1)">
      <option value="">全部等级</option>
      <option value="critical">严重</option><option value="high">高危</option>
      <option value="medium">中危</option><option value="low">低危</option>
      <option value="info">信息</option><option value="unknown">未知</option>
    </select>
    <select class="select" id="lcFilter" style="width:130px" onchange="loadReports(1)">
      <option value="">全部处置状态</option>
      <option value="open">待整改</option>
      <option value="fixing">整改中</option>
      <option value="fixed">已修复待复测</option>
      <option value="verified">复测通过</option>
    </select>
    <button class="btn btn-primary" onclick="loadReports(1)">搜索</button>
    <span class="spacer"></span>
    <button class="btn btn-warning btn-sm" onclick="openExport()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>导出报告
    </button>
    <button class="btn btn-ghost btn-sm" onclick="openQA()">📋 质量体检</button>
    <button class="btn btn-ghost btn-sm" onclick="openTemplateMgr()">模板管理</button>
    <button class="btn btn-primary btn-sm" onclick="openAdd()">+ 新增报告</button>
  </div>
  <div class="table-wrap" id="reportTable"><div class="loading-mask"><div class="spinner"></div>加载中...</div></div>
  <div class="pagination" id="reportPager"></div>
</div>
{% endblock %}

{% block js %}
<script>
let curPage = 1, curLimit = 10, totalCount = 0, allReports = [];

async function loadReports(page) {
  curPage = page;
  const el = document.getElementById("reportTable");
  ZhiShield.showLoading(el);
  const u = document.getElementById("kwUnit").value.trim();
  const v = document.getElementById("kwVul").value.trim();
  const s = document.getElementById("sevFilter").value;
  const lc = document.getElementById("lcFilter").value;
  const r = await ZhiShield.api(`/api/reports?page=${page}&limit=${curLimit}&unitName=${encodeURIComponent(u)}&vulName=${encodeURIComponent(v)}&severity=${s}&lifecycle=${lc}`);
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  totalCount = r.count;
  allReports = r.data;
  if (!r.data.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-title">暂无报告</div><div class="empty-desc">点击「+ 新增报告」手工录入，或使用「AI 智能生成」批量产出</div></div>`;
  } else {
    let html = `<table class="data-table"><thead><tr>
      <th style="width:32px"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
      <th>ID</th><th>单位名称</th><th>系统名称</th><th>漏洞名称</th><th>等级</th><th>处置状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>`;
    r.data.forEach(x => {
      html += `<tr>
        <td><input type="checkbox" class="row-check" value="${x.id}"></td>
        <td>${x.id}</td>
        <td style="font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ZhiShield.esc(x.unit_name)}</td>
        <td style="max-width:120px">${ZhiShield.esc(x.system_name || "-")}</td>
        <td style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ZhiShield.esc(x.vul_name)}</td>
        <td>${ZhiShield.sevBadge(x.severity)}</td>
        <td>${lcCell(x)}</td>
        <td style="font-size:12px;color:#94a3b8">${ZhiShield.fmtTime(x.updated_at)}</td>
        <td style="white-space:nowrap">
          <a class="link-btn" onclick="viewReport(${x.id})">详情</a>
          <a class="link-btn" onclick="qaOne(${x.id})">体检</a>
          <a class="link-btn" onclick="editReport(${x.id})">编辑</a>
          <a class="link-btn danger" onclick="delReport(${x.id})">删除</a>
        </td></tr>`;
    });
    el.innerHTML = html + "</tbody></table>";
  }
  ZhiShield.renderPagination(document.getElementById("reportPager"), curPage, totalCount, curLimit, loadReports);
}
function toggleAll(cb) {
  document.querySelectorAll(".row-check").forEach(c => c.checked = cb.checked);
}
function selectedIds() {
  return Array.from(document.querySelectorAll(".row-check:checked")).map(c => parseInt(c.value));
}

/* ---------------- 漏洞处置全生命周期闭环 ---------------- */
const LC_CN = {open:"待整改", fixing:"整改中", fixed:"已修复待复测", verified:"复测通过"};
const LC_STYLE = {
  open:   ["#dc2626","#fee2e2"],
  fixing: ["#2563eb","#dbeafe"],
  fixed:  ["#b45309","#fef3c7"],
  verified:["#15803d","#dcfce7"]
};
const LC_NEXT = {
  open:   [{v:"fixing", t:"开始整改"}],
  fixing:[{v:"fixed", t:"提交整改"}, {v:"open", t:"退回"}],
  fixed: [{v:"verified", t:"复测通过"}, {v:"fixing", t:"复测退回"}],
  verified:[{v:"fixed", t:"撤销复测"}]
};
function lcBadge(lc) {
  const k = lc || "open"; const c = LC_CN[k]; const st = LC_STYLE[k] || LC_STYLE.open;
  return `<span style="display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;color:${st[0]};background:${st[1]};white-space:nowrap">${c}</span>`;
}
function lcCell(x) {
  const k = x.lifecycle || "open";
  const acts = (LC_NEXT[k] || []).map(n =>
    `<a class="link-btn" style="font-size:12px" onclick="moveLifecycle(${x.id},'${n.v}')">${n.t}</a>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:4px">${lcBadge(k)}<div style="display:flex;gap:8px;flex-wrap:wrap">${acts}</div></div>`;
}
async function moveLifecycle(id, target) {
  const r = await ZhiShield.api("/api/report/lifecycle", { json: { id, lifecycle: target } });
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  ZhiShield.success(r.msg);
  loadReports(curPage);
}

/* ---------------- 报告表单 ---------------- */
let unitTxtInput, vulTxtInput;
let rteDetail = null, rteProve = null;
let detailImgZone = null, proveImgZone = null;

function parseImgField(v) {
  if (Array.isArray(v)) return v.slice();
  if (!v) return [];
  try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; }
  catch (e) { return v.split(",").map(s => s.trim()).filter(Boolean); }
}

function reportForm(u = {}) {
  const v = (k) => ZhiShield.esc(u[k] || "");
  // input 为空元素，值必须放在 value 属性中（原来写在 <input>…</input> 之间会被浏览器丢弃，导致编辑回填失败）；textarea 才用标签体
  const f = (k, label, ph = "", type = "input") => type === "textarea"
    ? `<div class="form-item"><label>${label}</label>
       <textarea class="textarea" id="r_${k}" placeholder="${ph}" rows="2">${v(k)}</textarea></div>`
    : `<div class="form-item"><label>${label}</label>
       <input class="input" id="r_${k}" placeholder="${ph}" value="${v(k)}"></div>`;
  return `<div class="form-grid">
    ${f("unit_name", "单位名称", "支持模糊搜索自动匹配；填写已有单位可带出历史域名", "input")}
    ${f("system_name", "系统名称", "如：官网 / 后台管理系统")}
    ${f("vul_name", "漏洞名称", "支持从漏洞库选择", "input")}
    <div class="form-item"><label>漏洞等级</label><select class="select" id="r_severity">
      ${["critical","high","medium","low","info","unknown"].map(s =>
        `<option value="${s}" ${u.severity===s?"selected":""}>${({critical:"严重",high:"高危",medium:"中危",low:"低危",info:"信息",unknown:"未知"})[s]}</option>`).join("")}
    </select></div>
    <div class="form-item"><label>漏洞地址 / URL<span style="font-weight:400;color:#0ea5e9;font-size:12px"> 填好自动识别域名</span></label>
      <input class="input" id="r_address" placeholder="http(s)://、mqtt://、IP:端口 均可" value="${v("address")}"></div>
    <div class="form-item"><label>域名</label>
      <input class="input" id="r_domain" placeholder="根据地址自动填入，可手动修改" value="${v("domain")}"></div>
    <div class="form-item full"><div class="unit-assist" id="unitAssist"></div></div>
    <div class="form-item full"><label>漏洞描述</label><textarea class="textarea" id="r_description" rows="3">${ZhiShield.esc(u.description || "")}</textarea></div>
    <div class="form-item full"><label>漏洞危害</label><textarea class="textarea" id="r_harm" rows="2">${ZhiShield.esc(u.harm || "")}</textarea></div>
    <div class="form-item full"><label>检测过程（富文本，可插图）</label><textarea class="textarea" id="r_detail" rows="5" style="display:none">${ZhiShield.esc(u.detail || "")}</textarea></div>
    <div class="form-item full"><label style="margin-bottom:4px">检测过程图片（多张，导出时附在“检测过程”之后）</label><div id="detailImgZone"></div></div>
    <div class="form-item full"><label>整改建议</label><textarea class="textarea" id="r_suggestion" rows="3">${ZhiShield.esc(u.suggestion || "")}</textarea></div>
    <div class="form-item full"><label>归属证明（富文本，可插图）<span style="font-weight:400;color:#94a3b8"> · <a class="link-btn" style="font-size:12px" onclick="loadLatestProve()">按域名获取最近检测记录</a> · <a class="link-btn" id="autoAttribBtn" style="font-size:12px;color:#16a34a" onclick="autoFetchAttrib()">一键自动取证（截取官网页脚备案信息）</a></span></label><textarea class="textarea" id="r_prove" rows="5" style="display:none">${ZhiShield.esc(u.prove || "")}</textarea></div>
    <div class="form-item full"><label style="margin-bottom:4px">归属证明图片（多张，导出时附在“归属证明”之后）</label><div id="proveImgZone"></div></div>
  </div>`;
}

/* 按域名获取最近检测记录，填充归属证明 */
async function loadLatestProve() {
  const domain = (document.getElementById("r_domain") || {}).value || "";
  if (!domain.trim()) { ZhiShield.error("请先填写域名"); return; }
  const r = await ZhiShield.api("/api/report/latest-prove?domain=" + encodeURIComponent(domain.trim()));
  if (r.code === 0) {
    if (rteProve) rteProve.setValue(r.data.prove || "");
    // 同时把该域名上一份报告的归属证明图片带出来，无需重新截图
    const imgs = Array.isArray(r.data.prove_images) ? r.data.prove_images : [];
    if (proveImgZone) proveImgZone.setValue(imgs);
    ZhiShield.success(imgs.length ? ("已填入最近检测记录及 " + imgs.length + " 张归属证明图片") : "已填入最近检测记录");
  } else ZhiShield.info(r.msg || "未找到历史记录");
}

/* 一键自动归属取证：按域名/地址打开官网截图、识别 ICP/公网安备/主体，回填归属证明文字与图片 */
async function autoFetchAttrib() {
  const domEl = document.getElementById("r_domain");
  const addrEl = document.getElementById("r_address");
  const domain = (domEl && domEl.value || "").trim();
  const address = (addrEl && addrEl.value || "").trim();
  if (!domain && !address) { ZhiShield.error("请先填写域名或漏洞地址"); return; }
  const btn = document.getElementById("autoAttribBtn");
  if (btn) { btn.style.opacity = ".55"; btn.style.pointerEvents = "none"; }
  ZhiShield.info("正在读取目标站点页脚备案信息，约需 10~20 秒，请勿重复点击…");
  try {
    const r = await ZhiShield.api("/api/report/auto-attrib",
      { method: "POST", json: { domain, address } });
    if (r.code === 0) {
      const d = r.data || {};
      if (rteProve && d.summary) rteProve.setValue(d.summary);
      if (d.image_url && proveImgZone) {
        const list = proveImgZone.getValue();
        if (!list.includes(d.image_url)) proveImgZone.setValue(list.concat([d.image_url]));
      }
      ZhiShield.success(r.msg || "已自动完成归属取证");
    } else {
      ZhiShield.info((r.msg || "未能自动获取") + "（可手动上传截图）");
    }
  } catch (e) {
    ZhiShield.error("自动取证失败，请手动上传归属截图");
  } finally {
    if (btn) { btn.style.opacity = "1"; btn.style.pointerEvents = "auto"; }
  }
}

function setupAutocomplete(inputId, apiUrl, onPick) {  const input = document.getElementById(inputId);
  if (!input) return;
  let box = null;
  const showBox = () => {
    if (box) box.remove();
    box = document.createElement("div");
    box.style.cssText = "position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:300;max-height:220px;overflow:auto";
    input.parentNode.style.position = "relative";
    input.parentNode.appendChild(box);
  };
  input.addEventListener("input", async () => {
    const q = input.value.trim();
    if (!q) { if (box) { box.remove(); box = null; } return; }
    const r = await ZhiShield.api(apiUrl + encodeURIComponent(q));
    if (!r.code === 0 || !r.data.length) { if (box) box.remove(); return; }
    showBox();
    box.innerHTML = r.data.map(d => `<div data-v='${JSON.stringify(d).replace(/'/g,"&#39;")}' style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9">${ZhiShield.esc(d.unit_name || d.name || d.enterprise_name)}</div>`).join("");
    box.querySelectorAll("div[data-v]").forEach(d => d.addEventListener("click", () => {
      onPick(JSON.parse(d.dataset.v.replace(/&#39;/g, "'")));
      box.remove(); box = null;
    }));
  });
  input.addEventListener("blur", () => setTimeout(() => { if (box) { box.remove(); box = null; } }, 200));
}

/* 表单公共初始化：自动补全、富文本、两个独立多图区、地址→域名自动识别、同单位历史资产匹配 */
function initReportForm(u) {
  u = u || {};
  setupAutocomplete("r_unit_name", "/api/unit/search?q=", d => {
    document.getElementById("r_unit_name").value = d.enterprise_name;
    loadUnitAssets();
  });
  setupAutocomplete("r_vul_name", "/api/vulnerability/search?q=", d => {
    document.getElementById("r_vul_name").value = d.name;
    document.getElementById("r_severity").value = d.severity;
    document.getElementById("r_description").value = d.description || "";
    document.getElementById("r_harm").value = d.harm || "";
    document.getElementById("r_suggestion").value = d.suggestion || "";
  });
  rteDetail = ZhiShield.rteInit(document.getElementById("r_detail"));
  rteProve = ZhiShield.rteInit(document.getElementById("r_prove"));
  detailImgZone = ZhiShield.imageZone(document.getElementById("detailImgZone"),
    { value: parseImgField(u.detail_images), hint: "检测过程截图 / 复现图（可多张，拖拽排序）" });
  proveImgZone = ZhiShield.imageZone(document.getElementById("proveImgZone"),
    { value: parseImgField(u.prove_images), hint: "归属证明截图：ICP / 备案 / 资产归属等（可多张）" });

  const addr = document.getElementById("r_address");
  const dom = document.getElementById("r_domain");
  // 填地址自动识别主机名并回填；用户手动改过域名后不再覆盖
  const autoFill = () => {
    const h = ZhiShield.extractHost(addr.value);
    if (h && (!dom.value.trim() || dom.dataset.auto === "1")) {
      dom.value = h; dom.dataset.auto = "1";
    }
  };
  addr.addEventListener("input", autoFill);
  addr.addEventListener("blur", autoFill);
  dom.addEventListener("input", () => { dom.dataset.auto = "0"; });

  // 单位名失焦 → 拉取该单位历史域名 / 系统，点击即可带出
  document.getElementById("r_unit_name")
    .addEventListener("blur", () => setTimeout(loadUnitAssets, 220));
  if (u.unit_name) loadUnitAssets();
}

/* 同单位历史域名 / 系统自动匹配 */
async function loadUnitAssets() {
  const nameEl = document.getElementById("r_unit_name");
  const box = document.getElementById("unitAssist");
  if (!nameEl || !box) return;
  const name = nameEl.value.trim();
  if (!name) { box.innerHTML = ""; return; }
  const r = await ZhiShield.api("/api/report/unit-assets?unit_name=" + encodeURIComponent(name));
  if (r.code !== 0 || !r.data) { box.innerHTML = ""; return; }
  const d = r.data;
  let html = "";
  if (d.domains && d.domains.length) {
    // 新增（域名框为空）且该单位只有一个历史域名时，自动带出，免去再点
    const dm0 = document.getElementById("r_domain");
    if (d.domains.length === 1 && dm0 && !dm0.value.trim()) {
      dm0.value = d.domains[0]; dm0.dataset.auto = "1";
    }
    html += '<span style="font-size:12px;color:#94a3b8;align-self:center">历史域名：</span>' +
      d.domains.map(x => `<span class="ua-chip" data-type="domain" data-val="${ZhiShield.esc(x)}">${ZhiShield.esc(x)}</span>`).join("");
  }
  if (d.systems && d.systems.length) {
    html += '<span style="font-size:12px;color:#94a3b8;align-self:center;margin-left:6px">历史系统：</span>' +
      d.systems.slice(0, 5).map(x => `<span class="ua-chip" data-type="system" data-val="${ZhiShield.esc(x)}">${ZhiShield.esc(x)}</span>`).join("");
  }
  box.innerHTML = html;
  box.querySelectorAll(".ua-chip").forEach(c => c.addEventListener("click", () => {
    if (c.dataset.type === "domain") {
      const dm = document.getElementById("r_domain");
      dm.value = c.dataset.val; dm.dataset.auto = "0";
    } else {
      document.getElementById("r_system_name").value = c.dataset.val;
    }
  }));
}

function openAdd() {
  ZhiShield.openModal({
    title: "新增报告",
    size: "xl",
    body: reportForm(),
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="doSaveReport(0)">保存</button>`
  });
  initReportForm({});
}

async function editReport(id) {
  const r = await ZhiShield.api("/api/report/detail?id=" + id);
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  const u = r.data;
  ZhiShield.openModal({
    title: "编辑报告 #" + id,
    size: "xl",
    body: reportForm(u),
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="doSaveReport(${id})">保存</button>`
  });
  setupAutocomplete("r_unit_name", "/api/unit/search?q=", d => {
    document.getElementById("r_unit_name").value = d.enterprise_name;
  });
  setupAutocomplete("r_vul_name", "/api/vulnerability/search?q=", d => {
    document.getElementById("r_vul_name").value = d.name;
    document.getElementById("r_severity").value = d.severity;
  });
  rteDetail = ZhiShield.rteInit(document.getElementById("r_detail"));
  rteProve = ZhiShield.rteInit(document.getElementById("r_prove"));
}

async function doSaveReport(id) {
  const g = k => { const el = document.getElementById("r_" + k); return el ? el.value : ""; };
  const body = {
    unit_name: g("unit_name").trim(), system_name: g("system_name").trim(),
    vul_name: g("vul_name").trim(), domain: g("domain").trim(),
    address: g("address").trim(), description: g("description"),
    harm: g("harm"), suggestion: g("suggestion"),
    severity: document.getElementById("r_severity").value,
    detail: rteDetail ? rteDetail.getValue() : g("detail"),
    prove: rteProve ? rteProve.getValue() : g("prove"),
    detail_images: detailImgZone ? detailImgZone.getValue() : [],
    prove_images: proveImgZone ? proveImgZone.getValue() : [],
  };
  if (!body.unit_name || !body.vul_name) { ZhiShield.error("单位名称与漏洞名称必填"); return; }
  const url = id ? "/api/report/update" : "/api/report/add";
  if (id) body.id = id;
  const r = await ZhiShield.api(url, { json: body });
  if (r.code === 0) { ZhiShield.success(r.msg); ZhiShield.closeModal(); loadReports(curPage); }
  else ZhiShield.error(r.msg);
}

async function viewReport(id) {
  const r = await ZhiShield.api("/api/report/detail?id=" + id);
  if (r.code !== 0) return;
  const u = r.data;
  ZhiShield.openModal({
    title: "报告详情",
    size: "lg",
    body: `<div>
      <div class="kv-row"><div class="k">单位名称</div><div class="v">${ZhiShield.esc(u.unit_name)}</div></div>
      <div class="kv-row"><div class="k">系统名称</div><div class="v">${ZhiShield.esc(u.system_name || "-")}</div></div>
      <div class="kv-row"><div class="k">域名</div><div class="v">${ZhiShield.esc(u.domain || "-")}</div></div>
      <div class="kv-row"><div class="k">漏洞名称</div><div class="v">${ZhiShield.esc(u.vul_name)}</div></div>
      <div class="kv-row"><div class="k">漏洞等级</div><div class="v">${ZhiShield.sevBadge(u.severity)}</div></div>
      <div class="kv-row"><div class="k">漏洞地址</div><div class="v">${ZhiShield.esc(u.address || "-")}</div></div>

async function doExport() {
  const ids = selectedIds().length ? selectedIds() : allReports.map(r => r.id);
  const fmt = document.getElementById("expFormat").value;
  const tplKey = document.getElementById("expTemplate").value;
  const tplId = tplKey === "custom" ? document.getElementById("expCustomTpl").value : "";
  const org = document.getElementById("expOrg").value.trim();
  if (fmt === "pdf" && tplKey === "custom") { ZhiShield.error("自定义模板暂仅支持 Word，请选择 PDF 内置模板或改用 Word"); return; }
  if (fmt === "pdf" && tplKey === "gongwen" && ids.length !== 1) {
    ZhiShield.error("公文模板仅支持单条报告，请只勾选一条"); return;
  }
  const btn = document.getElementById("expBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> 生成中...';
  try {
    const endpoint = fmt === "pdf" ? "/api/report/export-pdf" : "/api/report/export";
    const r = await ZhiShield.api(endpoint, { json: { report_ids: ids, template_key: tplKey, template_id: tplId, org_footer: org } });
    if (r.code === 0) {
      ZhiShield.success("报告生成成功，开始下载");
      ZhiShield.closeModal();
      setTimeout(() => { window.location.href = r.url; }, 400);
    } else ZhiShield.error(r.msg);
  } catch (e) { ZhiShield.error("导出失败：" + e.message); }
  btn.disabled = false; btn.innerHTML = btn.dataset.orig;
}

async function uploadTpl() {
  const name = document.getElementById("tplName").value.trim();
  const f = document.getElementById("tplFile").files[0];
  if (!name || !f) { ZhiShield.error("请填写名称并选择文件"); return; }
  const fd = new FormData();
  fd.append("name", name); fd.append("file", f);
  const r = await ZhiShield.api("/api/report/template/upload", { method: "POST", body: fd });
  if (r.code === 0) {
    if (r.placeholders && r.placeholders.length) {
      ZhiShield.success(`上传成功，识别到 ${r.placeholders.length} 个可填充字段`);
    } else {
      ZhiShield.info("上传成功，但未检测到 \x7b\x7b占位符\x7d\x7d，该模板将按原样输出");
    }
    openTemplateMgr();
  }
  else ZhiShield.error(r.msg);
}

function renderTplMapModal() {
  const d = tplExtractData;
  const L = "\x7b\x7b", R = "\x7d\x7d";   // 避免被 Jinja 当成模板变量
  const fieldOpts = [`<option value="">— 不替换（保留原文）—</option>`,
    `<option value="${d.title_key}">标题：${L}单位名称${R}存在${L}漏洞名称${R}</option>`]
    .concat(d.fields.map(x => `<option value="${x.key}">${L}${x.name}${R}</option>`)).join("");
  const rows = d.paragraphs
    .filter(p => (p.text && p.text.trim()) || p.has_image)
    .map(p => {
      const tag = p.has_image ? '<span class="badge badge-info" style="margin-right:6px">图</span>'
        : (p.heading ? '<span class="badge badge-blue" style="margin-right:6px">标题</span>' : "");
      const sel = p.suggest ? fieldOpts.replace(`value="${p.suggest}"`, `value="${p.suggest}" selected`) : fieldOpts;
      return `<tr>
        <td style="width:42px;text-align:center;color:#94a3b8">${p.idx}</td>
        <td style="max-width:420px">${tag}<span style="font-size:12.5px">${ZhiShield.esc(p.text || "［图片］")}</span></td>
        <td style="width:210px"><select class="select tpl-map-sel" data-idx="${p.idx}">${sel}</select></td>
      </tr>`;
    }).join("");
  ZhiShield.openModal({
    title: "核对字段映射（自动识别，可手动调整）",
    size: "lg",
    body: `<div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:12.5px;color:#475569;line-height:1.9;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px">
        系统已按章节标题自动猜测每段对应的字段（下拉已预选）。请<b>逐段核对</b>：内容段选择对应字段后会被替换成占位符；
        “漏洞描述/检测过程/建议”等若有多段内容，只需保留一个占位段，其余内容段也选同一字段（会自动合并、不重复）；
        成品里的旧截图会自动剔除，新报告导出时插入你上传的新图。
      </div>
      <div class="form-item" style="max-width:320px"><label>新模板名称</label>
        <input class="input" id="tplMapName" placeholder="如：浙江送检标准版"></div>
      <div style="max-height:46vh;overflow:auto;border:1px solid #e2e8f0;border-radius:8px">
        <table class="data-table"><thead><tr><th>#</th><th>报告原文段落</th><th>映射为字段</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="empty-row">未解析到有效段落</td></tr>'}</tbody></table>
      </div>
    </div>`,
    footer: `<button class="btn btn-ghost" onclick="ZhiShield.closeModal()">取消</button>
             <button class="btn btn-primary" onclick="confirmBuildTpl()">生成模板</button>`
  });
}

async function confirmBuildTpl() {
  const name = (document.getElementById("tplMapName") || {}).value ? document.getElementById("tplMapName").value.trim() : "";
  if (!name) { ZhiShield.error("请填写新模板名称"); return; }
  const mapping = {};
  document.querySelectorAll(".tpl-map-sel").forEach(sel => {
    if (sel.value) mapping[sel.dataset.idx] = sel.value;
  });
  if (!Object.keys(mapping).length) { ZhiShield.error("请至少为一个内容段选择对应字段"); return; }
  const r = await ZhiShield.api("/api/report/template/build-from-doc",
    { json: { token: tplExtractData.token, name, mapping } });
  if (r.code === 0) {
    ZhiShield.success(`模板已生成，含 ${(r.placeholders || []).length} 个可自动填充字段`);
    ZhiShield.closeModal();
    openTemplateMgr();
  } else ZhiShield.error(r.msg);
}

async function setDefaultTpl(id) {
  const r = await ZhiShield.api("/api/report/template/set-default", { json: { id } });
  if (r.code === 0) { ZhiShield.success(r.msg); openTemplateMgr(); } else ZhiShield.error(r.msg);
}
function delTpl(id, name) {
  ZhiShield.confirmDialog(`确定删除模板「${name}」？`, async () => {
    const r = await ZhiShield.api("/api/report/template/delete", { json: { id } });
    if (r.code === 0) { ZhiShield.success("已删除"); openTemplateMgr(); } else ZhiShield.error(r.msg);
  }, "删除");
}

loadTemplates();
loadReports(1);
</script>
{% endblock %}
