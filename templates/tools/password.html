{% extends "base.html" %}
{% block title %}随机密码生成{% endblock %}
{% block page_title %}随机密码生成{% endblock %}
{% block page_crumb %}工具 / 弱口令与随机密码{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body" style="max-width:680px">
    <div class="form-grid">
      <div class="form-item"><label>密码长度</label><input class="input" id="pLen" type="number" value="12" min="4" max="128"></div>
      <div class="form-item"><label>生成数量</label><input class="input" id="pCount" type="number" value="10" min="1" max="100"></div>
      <div class="form-item full">
        <label>字符类型</label>
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <label class="check-row"><input type="checkbox" class="input" id="pUpper" checked> 大写字母 (A-Z)</label>
          <label class="check-row"><input type="checkbox" class="input" id="pLower" checked> 小写字母 (a-z)</label>
          <label class="check-row"><input type="checkbox" class="input" id="pNum" checked> 数字 (0-9)</label>
          <label class="check-row"><input type="checkbox" class="input" id="pSpec" checked> 特殊符号 (!@#...)</label>
        </div>
      </div>
    </div>
    <div style="margin-top:16px"><button class="btn btn-primary" onclick="genPwd()">生成密码</button></div>
    <div id="pwdResult" style="margin-top:16px"></div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
async function genPwd() {
  const r = await ZhiShield.api("/api/tools/password", { json: {
    length: parseInt(document.getElementById("pLen").value) || 12,
    count: parseInt(document.getElementById("pCount").value) || 10,
    uppercase: document.getElementById("pUpper").checked,
    lowercase: document.getElementById("pLower").checked,
    numbers: document.getElementById("pNum").checked,
    special: document.getElementById("pSpec").checked,
  }});
  const box = document.getElementById("pwdResult");
  if (r.code !== 0) { ZhiShield.error(r.msg); return; }
  box.innerHTML = `<div class="code-block">${r.data.map(p => ZhiShield.esc(p)).join("\n")}</div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-ghost btn-sm" onclick="copyPwd()">复制全部</button>
      <span style="font-size:12px;color:#94a3b8;align-self:center">共 ${r.data.length} 条</span>
    </div>`;
  window._pwdText = r.data.join("\n");
}
async function copyPwd() {
  if (!window._pwdText) return;
  try {
    await navigator.clipboard.writeText(window._pwdText);
    ZhiShield.success("已复制到剪贴板");
  } catch (e) { ZhiShield.error("复制失败，请手动选择"); }
}
</script>
{% endblock %}
